image:
  name: ribose/metanorma
  entrypoint: [""]

cache:
  paths:

before_script:
  - apt-get update
  - apt-get install -y software-properties-common
  - add-apt-repository ppa:rmescandon/yq
  - apt-get update
  - apt-get install -y yq

build:
  stage: build
  except:
    - gh-pages
  script:
    - make clean all publish PUBLISHING_DIRECTORY=public
  artifacts:
    paths:
      - public
